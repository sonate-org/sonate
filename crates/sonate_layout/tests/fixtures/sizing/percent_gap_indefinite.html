<!--
Percentage gaps in a container whose size in that axis is not definite.
@matrix #inner row-gap: 10% | 10px
-->
<div id="root" style="width: 200px; height: 200px; align-items: flex-start">
  <div id="inner" style="flex-wrap: wrap; width: 100px; column-gap: 10%">
    <div style="width: 40px; height: 20px"></div>
    <div style="width: 40px; height: 20px"></div>
    <div style="width: 40px; height: 20px"></div>
  </div>
</div>
