<!--
After wrapping, every line flexes on its own.
@matrix #root flex-direction: row | column
@matrix #root flex-wrap: wrap | wrap-reverse
-->
<div id="root" style="width: 250px; height: 250px">
  <div style="flex: 1 1 100px; min-width: 30px; min-height: 30px"></div>
  <div style="flex: 2 1 100px; min-width: 30px; min-height: 30px"></div>
  <div style="flex: 1 1 60px; min-width: 30px; min-height: 30px"></div>
  <div style="flex: 0 1 100px; min-width: 30px; min-height: 30px"></div>
  <div style="flex: 1 1 120px; min-width: 30px; min-height: 30px"></div>
</div>
