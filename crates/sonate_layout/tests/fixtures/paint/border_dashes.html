<!--
Dashed and dotted borders: the gaps stretch so every side starts and ends with a dash or dot.
Thin dots are squares, thick ones round.
@screenshot
@matrix .box border-style: dashed | dotted
-->
<style>
  .box { width: 60px; height: 40px; border-color: rgb(30, 30, 200) }
</style>
<div id="root" style="width: 260px; height: 80px; padding: 10px; gap: 10px; align-items: flex-start">
  <div class="box" style="border-width: 2px"></div>
  <div class="box" style="border-width: 4px"></div>
  <div class="box" style="border-width: 6px"></div>
</div>
