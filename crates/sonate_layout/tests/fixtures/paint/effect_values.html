<!--
Computed values of the effect properties. Transforms combine into one matrix, with percentages
resolved against the border box and angles in any unit; shadows list all four lengths and their
color; out-of-range opacities are clamped.
@check opacity transform transform-origin box-shadow
@matrix #a transform: none | translate(10px) | translate(50%, -25%) | rotate(90deg) | rotate(0.5turn) | rotate(100grad) | rotate(1rad) | scale(2) | scale(1.5, 0.5) | scaleX(2) scaleY(3) | skew(10deg, 20deg) | skewY(-30deg) | translateX(calc(50% + 10px)) rotate(45deg) | matrix(1, 2, 3, 4, 5, 6) | translate(var(--x), 1em)
-->
<div id="root" style="width: 300px; height: 200px; --x: 7px; flex-wrap: wrap; align-content: flex-start">
  <div id="a" style="width: 80px; height: 40px; padding: 5px; opacity: 0.6"></div>
  <div style="width: 20px; height: 20px; box-shadow: 1px 2px red; transform-origin: left top"></div>
  <div style="width: 20px; height: 20px; box-shadow: inset 0 0 4px 2px rgba(0, 0, 255, 0.5), 3px 3px; color: green; transform-origin: 25% 75%; opacity: 0.25"></div>
  <div style="width: 20px; height: 20px; transform-origin: right 10px; opacity: 1.5"></div>
  <div style="width: 20px; height: 20px; transform-origin: calc(50% + 5px) bottom; opacity: -1"></div>
  <div style="width: 20px; height: 20px; transform-origin: top; box-shadow: 0 0 0 1em var(--missing, blue)"></div>
</div>
