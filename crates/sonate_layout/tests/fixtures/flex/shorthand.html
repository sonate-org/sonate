<!--
The flex shorthand: `flex: 1` is `1 1 0%`, `auto` is `1 1 auto` and `none` is `0 0 auto`.
@matrix #b flex: 1 | auto | none | 2 | 1 1 50px | 0 0 0%
-->
<div id="root" style="width: 300px; height: 100px">
  <div id="a" style="width: 50px; flex: 1">Abc</div>
  <div id="b" style="width: 80px">Hello world</div>
  <div id="c" style="width: 100px"></div>
</div>
