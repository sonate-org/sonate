<!--
Text in a column wraps at the column's width; heights follow the number of lines.
@matrix #root width: 40px | 80px | 200px
@matrix #root align-items: normal | flex-start
-->
<div id="root" style="width: 80px; height: 200px; flex-direction: column">
  <div>Hello world</div>
  <div style="padding: 5px">Lorem ipsum dolor sit</div>
</div>
