<!--
Opacity applies to an element and its descendants as a group, so overlapping children don't show
through each other, and nested opacities multiply.
@screenshot
@matrix #group opacity: 1 | 0.6 | 0.25 | 0
-->
<div id="root" style="width: 260px; height: 100px; padding: 10px; gap: 20px; align-items: flex-start">
  <div id="group" style="width: 100px; height: 70px; padding: 5px; background: rgb(255, 200, 0)">
    <div style="width: 50px; height: 40px; flex-shrink: 0; background: rgb(200, 0, 0)"></div>
    <div style="width: 50px; height: 40px; flex-shrink: 0; margin: 20px 0 0 -25px; background: rgb(0, 0, 200)"></div>
  </div>
  <div style="width: 100px; height: 70px; opacity: 0.5; background: rgb(0, 150, 0); padding: 10px">
    <div style="width: 40px; height: 40px; opacity: 0.5; background: black; border: 4px solid red"></div>
  </div>
</div>
