<!--
Auto margins on items of a wrapping container apply per line.
@matrix #root flex-direction: row | column
-->
<div id="root" style="width: 200px; height: 200px; flex-wrap: wrap">
  <div style="width: 70px; height: 40px; margin-left: auto"></div>
  <div style="width: 70px; height: 40px"></div>
  <div style="width: 70px; height: 40px; margin: auto"></div>
  <div style="width: 70px; height: 40px; margin-top: auto"></div>
</div>
