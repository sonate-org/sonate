<!--
Empty items have no content size; padding and border still count, and they stretch by default.
@matrix #root align-items: normal | flex-start
@matrix #root flex-direction: row | column
-->
<div id="root" style="width: 200px; height: 100px">
  <div></div>
  <div style="padding: 5px 10px"></div>
  <div style="border: 3px solid"></div>
  <div style="flex-grow: 1"></div>
</div>
