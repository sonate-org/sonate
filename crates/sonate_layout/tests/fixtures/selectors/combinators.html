<!--
Descendant, child, next-sibling and subsequent-sibling combinators.
@check color background-color border-top-color
-->
<div id="root" class="list" style="width: 400px; height: 100px">
  <div class="item">one</div>
  <div class="item special">two</div>
  <div class="item">three</div>
  <div class="group"><div class="item">nested</div><span class="item">inner</span></div>
  <div class="item">four</div>
</div>
<style>
  .list .item { color: rgb(255, 0, 0); }
  .list > .item { background-color: rgb(0, 255, 0); }
  .special + .item { color: rgb(0, 0, 255); }
  .special ~ .item { background-color: rgb(0, 0, 128); }
  .group > .item { border-top-color: rgb(1, 2, 3); }
  .group .item + span { color: rgb(4, 5, 6); }
  #root > .group > div { background-color: rgb(7, 8, 9); }
  .list    >    .group span { width: 40px; }
</style>
