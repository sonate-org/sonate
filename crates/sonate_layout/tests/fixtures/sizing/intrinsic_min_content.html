<!--
Min-content contributions: a shrinking row whose items are content-sized containers.
@matrix #root width: 60px | 120px | 400px
-->
<div id="root" style="width: 120px; height: 200px; align-items: flex-start">
  <div id="col" style="flex-direction: column; padding: 2px">
    <div>Hello world</div>
    <div>Hi</div>
  </div>
  <div id="row" style="column-gap: 4px">
    <div>Foo bar</div>
    <div>Baz</div>
  </div>
  <div id="wrap" style="flex-wrap: wrap; column-gap: 4px">
    <div>Aaa</div>
    <div>Bbbbb</div>
  </div>
</div>
