<!--
With negative free space, space-between falls back to flex-start and space-around/space-evenly to center.
@matrix #root justify-content: flex-start | flex-end | center | space-between | space-around | space-evenly
@matrix #root flex-direction: row | row-reverse
-->
<div id="root" style="width: 100px; height: 50px">
  <div style="width: 80px; height: 20px; flex-shrink: 0"></div>
  <div style="width: 60px; height: 20px; flex-shrink: 0"></div>
</div>
