<!--
Stretched and flexed sizes are definite, so percentages inside them resolve (§9.8).
@matrix #root flex-direction: row | column
-->
<div id="root" style="width: 300px; height: 200px">
  <div id="stretched" style="width: 100px; height: auto; min-height: 40px">
    <div style="height: 50%; width: 50%"></div>
  </div>
  <div id="flexed" style="flex-grow: 1">
    <div style="width: 50%; height: 25%"></div>
  </div>
</div>
