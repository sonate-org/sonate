<!--
Reverse directions and wrap-reverse inside each other.
@matrix #outer flex-direction: row-reverse | column-reverse
@matrix #inner flex-wrap: wrap | wrap-reverse
-->
<div id="root" style="width: 300px; height: 300px; flex-direction: column-reverse">
  <div id="outer" style="flex: 1; padding: 5px">
    <div id="inner" style="width: 150px; flex-direction: row-reverse; column-gap: 5px; align-content: flex-start">
      <div style="width: 40px; height: 30px"></div>
      <div style="width: 40px; height: 20px"></div>
      <div style="width: 40px; height: 30px"></div>
      <div style="width: 40px; height: 10px"></div>
      <div style="width: 40px; height: 30px"></div>
    </div>
    <div style="width: 50px; height: 50px"></div>
  </div>
  <div style="height: 40px"></div>
</div>
