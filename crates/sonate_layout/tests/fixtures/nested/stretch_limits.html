<!--
Stretching respects max sizes and margins, and the stretched size is definite for the item's own
content.
@matrix #root flex-direction: row | column
@matrix .s align-items: normal | center
-->
<div id="root" style="width: 240px; height: 240px">
  <div class="s" style="max-height: 150px; max-width: 150px; margin: 10px; flex-direction: column">
    <div style="flex: 1; min-width: 10px; min-height: 10px"></div>
    <div style="width: 20px; height: 20px"></div>
  </div>
  <div class="s" style="padding: 10px; border: 2px solid">
    <div style="width: 30px; height: 30px"></div>
  </div>
</div>
