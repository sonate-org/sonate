<!--
flex-grow shares positive free space in proportion to the grow factors.
@matrix #root flex-direction: row | column | row-reverse
@matrix #b flex-basis: auto | 0px | 30px
-->
<div id="root" style="width: 300px; height: 300px">
  <div id="a" style="width: 50px; height: 50px; flex-grow: 1"></div>
  <div id="b" style="width: 40px; height: 40px; flex-grow: 2"></div>
  <div id="c" style="width: 30px; height: 30px"></div>
</div>
