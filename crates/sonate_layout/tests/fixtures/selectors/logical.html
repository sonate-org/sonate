<!--
:not(), :is() and :where(), and their effect on specificity.
@check color background-color border-top-color
-->
<div id="root" style="width: 300px; height: 100px">
  <div class="a" id="first">a</div>
  <div class="b">b</div>
  <span class="a b">ab</span>
  <div class="c">c</div>
</div>
<style>
  :not(.a) { border-top-color: rgb(1, 1, 1); }
  div:not(.a, .b) { color: rgb(255, 0, 0); }
  :is(.a, .b) { background-color: rgb(0, 255, 0); }
  :where(#first) { color: rgb(0, 0, 255); }
  .a { color: rgb(2, 2, 2); }
  :is(#first, .x) { background-color: rgb(3, 3, 3); }
  .a.b { background-color: rgb(4, 4, 4); }
  span:not(:not(.b)) { color: rgb(5, 5, 5); }
</style>
