<!--
Items that hit their min or max size while flexing are frozen and the rest is shared again (§9.7).
@matrix #root width: 200px | 400px | 600px
@matrix #root flex-direction: row | row-reverse
-->
<div id="root" style="width: 400px; height: 100px">
  <div style="flex: 1 1 100px; max-width: 120px"></div>
  <div style="flex: 2 1 100px; min-width: 90px"></div>
  <div style="flex: 1 3 100px; min-width: 50px; max-width: 160px"></div>
  <div style="flex: 0 1 80px"></div>
</div>
