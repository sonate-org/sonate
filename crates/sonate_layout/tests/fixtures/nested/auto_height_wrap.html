<!--
An auto-height wrapping container inside a column is as tall as its lines.
@matrix #wrap row-gap: 0px | 10px
@matrix #root width: 150px | 250px
-->
<div id="root" style="width: 250px; height: 300px; flex-direction: column">
  <div id="wrap" style="flex-wrap: wrap; column-gap: 10px; padding: 5px">
    <div style="width: 60px; height: 30px"></div>
    <div style="width: 60px; height: 20px"></div>
    <div style="width: 60px; height: 40px"></div>
    <div style="width: 60px; height: 30px"></div>
    <div style="width: 60px; height: 10px"></div>
  </div>
  <div style="flex-grow: 1"></div>
</div>
