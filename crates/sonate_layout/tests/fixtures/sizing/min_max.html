<!--
min/max sizes clamp preferred sizes, growing and stretching; when min > max, min wins.
@matrix #root flex-direction: row | column
@matrix #root align-items: normal | flex-start
-->
<div id="root" style="width: 300px; height: 300px">
  <div style="width: 50px; height: 50px; min-width: 80px; min-height: 70px"></div>
  <div style="width: 200px; height: 200px; max-width: 100px; max-height: 120px"></div>
  <div style="flex-grow: 1; max-width: 60px; max-height: 60px"></div>
  <div style="min-width: 30px; max-width: 20px; min-height: 30px; max-height: 20px"></div>
</div>
