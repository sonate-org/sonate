<!--
Static positions in reversed directions and wrap-reverse containers.
@matrix #root flex-direction: row | row-reverse | column | column-reverse
@matrix #root flex-wrap: nowrap | wrap-reverse
-->
<div id="root" style="width: 200px; height: 100px; padding: 5px">
  <div style="width: 50px; height: 30px"></div>
  <div style="position: absolute; width: 40px; height: 20px"></div>
  <div style="position: absolute; width: 30px; height: 10px; align-self: flex-end"></div>
</div>
