<!--
Insets place an absolutely positioned child against the parent's padding box; left plus right or
top plus bottom stretch an auto size, and auto margins center a fixed size between them.
@matrix #abs inset: 10px auto auto 10px | 10px 20px auto 30px | auto 5px 5px auto | 10% 10% 10% 10% | 0px
-->
<div id="root" style="width: 200px; height: 100px; padding: 10px; border: 2px solid">
  <div id="abs" style="position: absolute; min-width: 20px; min-height: 10px"></div>
  <div style="position: absolute; left: 10px; right: 10px; top: 0px; width: 50px; height: 20px; margin: 0 auto"></div>
  <div style="position: absolute; right: 0px; bottom: 0px; padding: 3px">Hello world</div>
  <div style="position: absolute; left: 50%; top: 50%; width: 30%; height: 20%; margin: 2px"></div>
</div>
