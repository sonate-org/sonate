<!--
Font-relative, viewport and absolute units. The page is 1200x900 and the root font size 10px.
@matrix #root font-size: 10px | 20px
-->
<div id="root" style="width: 1000px; height: 300px; flex-wrap: wrap; align-content: flex-start">
  <div style="width: 5em; height: 1em"></div>
  <div style="width: 5rem; height: 2rem"></div>
  <div style="width: 10vw; height: 5vh"></div>
  <div style="width: 10vmin; height: 2vmax"></div>
  <div style="width: 1in; height: 0.5cm"></div>
  <div style="width: 20mm; height: 12pt"></div>
  <div style="width: 2pc; height: 10px; padding: 0.5em 1rem; margin-left: 1vw; border-left: 0.2em solid"></div>
  <div style="font-size: 1.5em; width: 2em; height: 1rem">Ab</div>
  <div style="font-size: 50%; width: 4em; height: 1em"></div>
</div>
