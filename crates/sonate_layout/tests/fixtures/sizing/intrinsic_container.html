<!--
Content-sized containers: fit-content widths and content heights from their items.
@matrix #root align-items: normal | flex-start | center
-->
<div id="root" style="width: 300px; height: 300px; flex-direction: column">
  <div id="row" style="padding: 5px; column-gap: 5px">
    <div style="width: 40px; height: 20px"></div>
    <div style="width: 60px; height: 30px; margin: 5px"></div>
  </div>
  <div id="wrapping" style="flex-wrap: wrap; padding: 5px; column-gap: 5px">
    <div style="width: 100px; height: 20px"></div>
    <div style="width: 100px; height: 20px"></div>
    <div style="width: 100px; height: 20px"></div>
    <div style="width: 100px; height: 20px"></div>
  </div>
  <div id="text-row">
    <div>Hello world</div>
    <div>and more text here</div>
  </div>
</div>
