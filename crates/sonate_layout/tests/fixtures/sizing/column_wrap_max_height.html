<!--
An auto-height column-wrap container breaks lines at its max-height, otherwise never.
@matrix #wrap max-height: none | 70px | 100px
@matrix #root align-items: normal | flex-start
-->
<div id="root" style="width: 300px; height: 300px">
  <div id="wrap" style="flex-direction: column; flex-wrap: wrap; column-gap: 5px; align-self: flex-start">
    <div style="width: 50px; height: 30px"></div>
    <div style="width: 40px; height: 30px"></div>
    <div style="width: 60px; height: 30px"></div>
    <div style="width: 30px; height: 30px"></div>
  </div>
</div>
