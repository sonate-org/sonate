<!--
Min/max sizes on content-sized containers, including lines stretched to a min-height.
@matrix #wrap min-height: auto | 100px
@matrix #wrap max-width: none | 90px
-->
<div id="root" style="width: 300px; height: 300px; flex-direction: column; align-items: flex-start">
  <div id="wrap" style="flex-wrap: wrap; padding: 5px">
    <div style="width: 40px; height: 20px"></div>
    <div style="width: 40px; height: 30px"></div>
    <div style="width: 40px"></div>
  </div>
</div>
