<!--
justify-content and align-items on an element place its text, like the anonymous flex item
around the text in Chrome.
@matrix .t justify-content: flex-start | center | flex-end | space-between
@matrix .t align-items: normal | center | flex-end
-->
<div id="root" style="width: 300px; height: 100px">
  <div class="t" style="width: 100px; height: 60px">Hi</div>
  <div class="t" style="width: 100px; height: 60px; flex-direction: column">Hi there</div>
</div>
