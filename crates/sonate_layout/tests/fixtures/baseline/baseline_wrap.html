<!--
Baseline alignment per line of a wrapping row, including nested and padded items.
@matrix #root width: 300px | 140px
-->
<div id="root" style="width: 300px; height: 200px; flex-wrap: wrap; align-items: baseline; align-content: flex-start; row-gap: 5px">
  <div style="font-size: 20px; padding-bottom: 10px">Big</div>
  <div style="padding-top: 12px">small</div>
  <div style="flex-direction: column; border-top: 3px solid"><div style="font-size: 15px">Mid</div><div>under</div></div>
  <div style="width: 30px; height: 15px; margin-bottom: 4px"></div>
  <div style="font-size: 30px">X</div>
</div>
