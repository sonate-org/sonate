<!--
`order` reorders items; items with equal order keep source order.
@matrix #root flex-direction: row | row-reverse | column
-->
<div id="root" style="width: 200px; height: 140px">
  <div id="a" style="width: 20px; height: 20px; order: 2"></div>
  <div id="b" style="width: 30px; height: 30px; order: -1"></div>
  <div id="c" style="width: 40px; height: 40px"></div>
  <div id="d" style="width: 50px; height: 10px; order: 2"></div>
</div>
