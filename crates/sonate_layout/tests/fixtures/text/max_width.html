<!--
max-width makes text wrap even when there is room; min-width keeps short text wide.
@matrix #root flex-direction: row | column
@matrix #root align-items: normal | flex-start
-->
<div id="root" style="width: 300px; height: 200px">
  <div style="max-width: 60px">Hello world again</div>
  <div style="min-width: 80px; min-height: 30px">Hi</div>
</div>
