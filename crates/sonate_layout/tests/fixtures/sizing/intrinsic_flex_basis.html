<!--
Content-sized row containers: does the max-content size use the items' flex-basis or their width?
@matrix #root align-items: flex-start | center
-->
<div id="root" style="width: 400px; height: 300px; flex-direction: column">
  <div id="basis-only">
    <div style="flex-basis: 100px; height: 10px"></div>
    <div style="flex-basis: 50px; height: 10px"></div>
  </div>
  <div id="basis-and-width">
    <div style="flex-basis: 100px; width: 30px; height: 10px"></div>
    <div style="width: 50px; height: 10px"></div>
  </div>
  <div id="grow">
    <div style="flex: 1; height: 10px">Ab</div>
    <div style="flex: 2 1 0px; height: 10px">Cdef</div>
  </div>
</div>
