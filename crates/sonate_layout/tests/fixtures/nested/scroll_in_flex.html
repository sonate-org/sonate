<!--
Scroll containers have an automatic minimum size of zero, so they shrink below their content.
@matrix #scroller overflow: visible | auto | hidden
@matrix #root flex-direction: column | row
-->
<div id="root" style="width: 200px; height: 150px">
  <div style="height: 40px; width: 40px; flex-shrink: 0"></div>
  <div id="scroller" style="flex-direction: column">
    <div style="height: 300px; width: 300px; flex-shrink: 0"></div>
  </div>
</div>
