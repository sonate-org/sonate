<!--
Container and item padding and borders with both box-sizing values.
@matrix .box box-sizing: content-box | border-box
@matrix #root flex-direction: row | column
-->
<div id="root" class="box" style="width: 300px; height: 200px; padding: 10px 20px; border: 5px solid">
  <div class="box" style="width: 100px; height: 50px; padding: 5px; border: 2px solid"></div>
  <div class="box" style="width: 60px; height: 40px; padding: 10px 0"></div>
  <div class="box" style="width: 10px; height: 10px; padding: 8px"></div>
  <div class="box" style="padding: 8px; border: 1px solid">Ab</div>
</div>
