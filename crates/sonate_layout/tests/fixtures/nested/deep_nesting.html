<!--
Twelve levels of alternating rows and columns, each with padding, a border and a fixed sibling.
@matrix .level align-items: normal | center
-->
<div id="root" style="width: 400px; height: 400px">
  <div class="level" style="flex: 1; flex-direction: column; padding: 3px; border: 1px solid">
    <div style="width: 10px; height: 10px"></div>
    <div class="level" style="flex: 1; padding: 3px; border: 1px solid">
      <div style="width: 10px; height: 10px"></div>
      <div class="level" style="flex: 1; flex-direction: column; padding: 3px; border: 1px solid">
        <div style="width: 10px; height: 10px"></div>
        <div class="level" style="flex: 1; padding: 3px; border: 1px solid">
          <div style="width: 10px; height: 10px"></div>
          <div class="level" style="flex: 1; flex-direction: column; padding: 3px; border: 1px solid">
            <div style="width: 10px; height: 10px"></div>
            <div class="level" style="flex: 1; padding: 3px; border: 1px solid">
              <div style="width: 10px; height: 10px"></div>
              <div class="level" style="flex: 1; flex-direction: column; padding: 3px; border: 1px solid">
                <div style="width: 10px; height: 10px"></div>
                <div class="level" style="flex: 1; padding: 3px; border: 1px solid">
                  <div style="width: 10px; height: 10px"></div>
                  <div class="level" style="flex: 1; flex-direction: column; padding: 3px; border: 1px solid">
                    <div style="width: 10px; height: 10px"></div>
                    <div class="level" style="flex: 1; padding: 3px; border: 1px solid">
                      <div style="width: 10px; height: 10px"></div>
                      <div class="level" style="flex: 1; flex-direction: column; padding: 3px; border: 1px solid">
                        <div style="width: 10px; height: 10px"></div>
                        <div class="level" style="flex: 1; padding: 3px; border: 1px solid">
                          <div>Deep</div>
                          <div style="width: 10px; height: 10px"></div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
