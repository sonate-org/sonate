<!--
Sides can have different styles; none and hidden sides take no space, and a missing color is the
text color.
@screenshot
-->
<div id="root" style="width: 260px; height: 70px; padding: 10px; gap: 10px; align-items: flex-start; color: rgb(120, 0, 160)">
  <div style="width: 40px; height: 40px; border: 8px solid; border-left-style: none"></div>
  <div style="width: 40px; height: 40px; border-width: 8px; border-style: solid double solid hidden; border-color: teal"></div>
  <div style="width: 40px; height: 40px; border-top: 10px solid red; border-bottom: 4px solid blue"></div>
  <div style="width: 40px; height: 40px; border: 6px solid rgba(0, 0, 255, 0.5); background: rgb(255, 200, 0)"></div>
</div>
